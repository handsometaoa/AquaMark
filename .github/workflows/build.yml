name: Build Extension

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: # 允许在 Actions 页面手动触发

permissions:
  contents: write # 打 tag 时创建 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 构建并打包 zip
        run: npm run zip

      # .output 是隐藏目录，upload-artifact 默认会忽略，先复制到普通目录
      - name: 收集打包产物
        run: |
          mkdir -p dist
          cp .output/*.zip dist/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: aquamark-extension
          path: dist/*.zip
          if-no-files-found: error

      - name: 发布 Release（仅 v* 标签触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
