<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>AquaMark</title>
  </head>
  <body>
    <!-- 氛围背景 -->
    <div class="bg" aria-hidden="true">
      <i class="orb o1"></i>
      <i class="orb o2"></i>
      <i class="orb o3"></i>
      <div class="noise"></div>
    </div>

    <!-- 顶栏 -->
    <header class="glass head">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path
            d="M12 3.2c2.6 3 5.4 6 5.4 9.2a5.4 5.4 0 1 1-10.8 0C6.6 9.2 9.4 6.2 12 3.2Z"
            fill="url(#dg)"
          />
          <circle cx="10" cy="12.6" r="1.5" fill="#fff" opacity=".85" />
          <defs>
            <linearGradient id="dg" x1="7" y1="4" x2="17" y2="18">
              <stop stop-color="#9ec5ff" />
              <stop offset="1" stop-color="#5b8dff" />
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="titles">
        <h1>AquaMark</h1>
        <p>域名水印</p>
      </div>
      <button id="masterSwitch" class="switch lg" aria-checked="true" aria-label="总开关" title="总开关">
        <i class="knob"></i>
      </button>
    </header>

    <main>
      <!-- 当前网站 -->
      <section id="currentCard" class="glass card cur"></section>

      <!-- 规则列表 -->
      <section class="glass card list-card">
        <div class="card-head">
          <h2>域名规则</h2>
          <div class="head-actions">
            <button id="importBtn" class="icon-tool" title="从 JSON 文件导入规则">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 4v11m0 0 4-4m-4 4-4-4M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              导入
            </button>
            <button id="exportBtn" class="icon-tool" title="导出规则为 JSON 文件">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 15V4m0 0 4 4m-4-4L8 8M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              导出
              <i class="dirty-dot" title="有未备份的改动"></i>
            </button>
            <button id="addBtn" class="btn-add">
              <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
              添加
            </button>
          </div>
          <input type="file" id="importFile" accept="application/json,.json" hidden />
        </div>
        <div id="ruleList" class="rule-list"></div>
        <i class="list-fade" aria-hidden="true"></i>
        <div id="emptyState" class="empty hidden">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 3.2c2.6 3 5.4 6 5.4 9.2a5.4 5.4 0 1 1-10.8 0C6.6 9.2 9.4 6.2 12 3.2Z" stroke="currentColor" stroke-width="1.4" />
          </svg>
          <b>还没有规则</b>
          <span>添加一个域名，为它定制水印</span>
        </div>
      </section>
    </main>

    <!-- 底部状态栏 -->
    <footer class="foot">
      <span class="foot-hint">卸载扩展会清除全部规则 · 请先「导出」备份</span>
      <button id="aboutBtn" class="foot-link">关于</button>
    </footer>

    <!-- 编辑抽屉 -->
    <div id="sheetWrap" class="sheet-wrap">
      <div class="sheet-mask" data-close></div>
      <div class="sheet glass" role="dialog" aria-label="编辑水印规则">
        <div class="sheet-grip"></div>
        <div class="sheet-title" id="sheetTitle">添加水印规则</div>

        <label class="field">
          <span class="field-label">域名</span>
          <input id="f-domain" class="input" type="text" placeholder="example.com（自动匹配子域名）" spellcheck="false" autocomplete="off" />
        </label>

        <label class="field">
          <span class="field-label">水印内容</span>
          <input id="f-text" class="input" type="text" placeholder="内部资料 · 禁止外传" spellcheck="false" autocomplete="off" maxlength="40" />
        </label>

        <div class="field">
          <div class="field-head">
            <span class="field-label">颜色</span>
            <span class="field-value mono" id="colorVal">#FFFFFF</span>
          </div>
          <div class="swatches" id="swatches"></div>
        </div>

        <div class="field">
          <div class="field-head">
            <span class="field-label">深浅</span>
            <span class="field-value" id="v-opacity">14%</span>
          </div>
          <input type="range" id="f-opacity" min="1" max="100" step="1" value="14" />
        </div>

        <div class="field">
          <div class="field-head">
            <span class="field-label">密度</span>
            <span class="field-value" id="v-density">5</span>
          </div>
          <input type="range" id="f-density" min="1" max="10" step="1" value="5" />
        </div>

        <div class="grid2">
          <div class="field">
            <div class="field-head">
              <span class="field-label">角度</span>
              <span class="field-value" id="v-rotation">-30°</span>
            </div>
            <input type="range" id="f-rotation" min="-90" max="90" step="5" value="-30" />
          </div>
          <div class="field">
            <div class="field-head">
              <span class="field-label">字号</span>
              <span class="field-value" id="v-fontsize">16px</span>
            </div>
            <input type="range" id="f-fontsize" min="10" max="48" step="2" value="16" />
          </div>
        </div>

        <div class="preview-wrap">
          <div id="preview" class="preview"></div>
          <span class="preview-tag">
            <i></i>实时预览
          </span>
        </div>

        <div class="sheet-actions">
          <button class="btn ghost" data-close>取消</button>
          <button id="saveBtn" class="btn primary">保存</button>
        </div>
      </div>
    </div>

    <!-- 关于 / 作者 -->
    <div id="aboutSheet" class="sheet-wrap">
      <div class="sheet-mask" data-about-close></div>
      <div class="sheet glass sheet-about" role="dialog" aria-label="关于 AquaMark">
        <div class="sheet-grip"></div>
        <div class="about-head">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 3.2c2.6 3 5.4 6 5.4 9.2a5.4 5.4 0 1 1-10.8 0C6.6 9.2 9.4 6.2 12 3.2Z" fill="url(#ag)" />
              <circle cx="10" cy="12.6" r="1.5" fill="#fff" opacity=".85" />
              <defs>
                <linearGradient id="ag" x1="7" y1="4" x2="17" y2="18">
                  <stop stop-color="#9ec5ff" />
                  <stop offset="1" stop-color="#5b8dff" />
                </linearGradient>
              </defs>
            </svg>
          </div>
          <div class="titles">
            <h1>AquaMark</h1>
            <p>域名水印 · <span id="aboutVersion">v1.1.0</span></p>
          </div>
        </div>
        <p class="about-desc">一款按域名动态为网页打水印的浏览器扩展。自定义内容、颜色、密度与深浅，防截图外泄，轻松区分生产与测试环境。</p>
        <div class="about-rows">
          <a class="about-row" href="https://github.com/handsometaoa" target="_blank" rel="noreferrer">
            <span>作者</span><span class="about-val">handsometaoa ↗</span>
          </a>
          <a class="about-row" href="https://github.com/handsometaoa/AquaMark" target="_blank" rel="noreferrer">
            <span>仓库地址</span><span class="about-val">github.com/handsometaoa/AquaMark ↗</span>
          </a>
          <a class="about-row" href="https://github.com/handsometaoa/AquaMark/issues" target="_blank" rel="noreferrer">
            <span>问题反馈</span><span class="about-val">提交 Issue ↗</span>
          </a>
          <div class="about-row">
            <span>技术栈</span><span class="about-val">WXT · TypeScript · Canvas</span>
          </div>
        </div>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
